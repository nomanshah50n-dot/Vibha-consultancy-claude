/* ═══════════════════════════════════════
   DESIGN TOKENS — WHITE & GOLD LUXURY
═══════════════════════════════════════ */
:root{
  --gold:         #b8934a;
  --gold-light:   #d4aa62;
  --gold-pale:    #f0ddb0;
  --gold-shine:   #e8c97a;
  --gold-dark:    #8a6a2e;
  --white:        #ffffff;
  --off-white:    #faf8f4;
  --cream:        #f4f0e8;
  --cream-2:      #ede9df;
  --bg-section:   #f7f4ef;
  --bg-card:      #ffffff;
  --border:       rgba(184,147,74,0.18);
  --border-strong:rgba(184,147,74,0.35);
  --text-dark:    #1a1612;
  --text-body:    #4a4035;
  --text-muted:   #7a6e62;
  --text-dim:     #a89e94;
  --shadow-sm:    0 2px 12px rgba(139,105,40,0.08);
  --shadow-md:    0 8px 32px rgba(139,105,40,0.12);
  --shadow-lg:    0 24px 64px rgba(139,105,40,0.16);
  --radius:       16px;
  --font-display: 'Cormorant Garamond', serif;
  --font-body:    'Jost', sans-serif;
  --transition:   0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  --section-pad:  clamp(80px,10vw,140px) 0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--off-white);color:var(--text-dark);font-family:var(--font-body);font-weight:400;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--cream)}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:99px}

/* ── TYPOGRAPHY ── */
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;letter-spacing:.01em;color:var(--text-dark)}
h1{font-size:clamp(40px,6.5vw,90px)}
h2{font-size:clamp(32px,4.5vw,58px)}
h3{font-size:clamp(19px,2.2vw,26px)}
p{font-size:clamp(14px,1.1vw,16px);color:var(--text-body);line-height:1.75}
a{text-decoration:none;color:inherit}

.section-label{font-family:var(--font-body);font-size:10.5px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:block}
.gold{color:var(--gold)}
.container{max-width:1280px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}

/* ── GOLD DIVIDER ── */
.gold-line{display:flex;align-items:center;gap:12px;margin:18px 0 32px}
.gold-line::before,.gold-line::after{content:'';flex:0 0 28px;height:1px;background:var(--gold-light)}
.gold-line::before{flex:0 0 28px}
.gold-line.center{justify-content:center}
.gold-line-inner{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 34px;border-radius:4px;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border:none;transition:var(--transition);position:relative;overflow:hidden}
.btn-gold{background:linear-gradient(135deg,var(--gold-dark) 0%,var(--gold) 50%,var(--gold-shine) 100%);color:#fff}
.btn-gold::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--gold-shine),var(--gold),var(--gold-dark));opacity:0;transition:.4s}
.btn-gold:hover::after{opacity:1}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(184,147,74,0.4)}
.btn-gold span{position:relative;z-index:1}
.btn-outline{background:transparent;color:var(--gold);border:1.5px solid var(--gold-light)}
.btn-outline:hover{background:var(--gold);color:#fff;border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow-md)}

/* ══════════════════════════════
   LOADER
══════════════════════════════ */

.mobile-menu.open{opacity:1;transform:translateY(0);pointer-events:all}

/* ══════════════════════════════
   HERO
══════════════════════════════ */

.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1800&q=85') center/cover no-repeat;transform:scale(1.06);animation:bgDrift 20s ease-in-out infinite alternate}

══════════════════════════════ */
